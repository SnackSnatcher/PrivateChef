name = "privatechef"
main = "src/index.js"
compatibility_date = "2026-08-08"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"

# Secrets are NOT set here — add them in the dashboard under
# Workers & Pages -> privatechef -> Settings -> Variables and Secrets:
#   TURNSTILE_SECRET_KEY
#   RESEND_API_KEY
#   MAIL_TO
#   MAIL_FROM
