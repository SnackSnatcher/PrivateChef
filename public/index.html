<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Domain for sale | privatechef.co.nz and privatechef.nz</title>
    <meta
      name="description"
      content="privatechef.co.nz and privatechef.nz are for sale as a pair. Suitable for a New Zealand private chef, catering, or private dining business."
    >
    <meta property="og:title" content="Domain for sale">
    <meta
      property="og:description"
      content="privatechef.co.nz and privatechef.nz are available as a pair."
    >
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://images.unsplash.com/photo-1556910103-1c02745aae4d?auto=format&fit=crop&w=1200&q=80">
    <style>
      :root {
        color-scheme: light;
        --ink: #181611;
        --muted: #625d54;
        --panel: rgba(255, 255, 255, 0.92);
        --line: rgba(24, 22, 17, 0.14);
        --accent: #a8472d;
        --accent-dark: #7d311f;
        --white: #ffffff;
        --shadow: 0 24px 80px rgba(16, 14, 10, 0.28);
        --ok-bg: #eaf3ec;
        --ok-ink: #235c34;
        --bad-bg: #fbeceb;
        --bad-ink: #8c2b20;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          linear-gradient(90deg, rgba(13, 18, 16, 0.84), rgba(13, 18, 16, 0.42)),
          url("https://images.unsplash.com/photo-1556910103-1c02745aae4d?auto=format&fit=crop&w=2200&q=82") center / cover fixed;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      main {
        width: min(1080px, calc(100% - 36px));
        min-height: 100vh;
        margin: 0 auto;
        display: grid;
        grid-template-columns: minmax(0, 0.95fr) minmax(340px, 0.72fr);
        gap: clamp(28px, 6vw, 72px);
        align-items: center;
        padding: 54px 0;
      }

      .intro {
        color: var(--white);
      }

      .eyebrow {
        margin: 0 0 16px;
        color: rgba(255, 255, 255, 0.78);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(52px, 9vw, 104px);
        line-height: 0.92;
        letter-spacing: 0;
      }

      .intro-text {
        max-width: 620px;
        margin: 24px 0 0;
        color: rgba(255, 255, 255, 0.86);
        font-size: clamp(18px, 2.2vw, 23px);
      }

      .domains {
        display: grid;
        gap: 12px;
        max-width: 580px;
        margin-top: 32px;
      }

      .domain {
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 8px;
        padding: 18px 20px;
        background: rgba(255, 255, 255, 0.12);
        color: var(--white);
        backdrop-filter: blur(10px);
      }

      .domain span {
        display: block;
        color: rgba(255, 255, 255, 0.68);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .domain strong {
        display: block;
        margin-top: 5px;
        overflow-wrap: anywhere;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(28px, 4vw, 44px);
        line-height: 1;
      }

      .contact {
        border: 1px solid rgba(255, 255, 255, 0.55);
        border-radius: 8px;
        padding: clamp(24px, 4vw, 36px);
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      h2 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(32px, 4vw, 44px);
        line-height: 1;
        letter-spacing: 0;
      }

      .contact p {
        margin: 14px 0 0;
        color: var(--muted);
      }

      label {
        display: block;
        margin: 16px 0 7px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 700;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 13px 14px;
        background: var(--white);
        color: var(--ink);
        font: inherit;
      }

      textarea {
        min-height: 124px;
        resize: vertical;
      }

      input:focus-visible,
      textarea:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      button {
        display: inline-flex;
        min-height: 48px;
        width: 100%;
        align-items: center;
        justify-content: center;
        margin-top: 18px;
        border: 0;
        border-radius: 6px;
        padding: 13px 18px;
        background: var(--accent);
        color: var(--white);
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      button:hover {
        background: var(--accent-dark);
      }

      button[disabled] {
        cursor: progress;
        opacity: 0.62;
      }

      .turnstile {
        margin-top: 18px;
        min-height: 65px;
      }

      .status {
        margin: 16px 0 0;
        border-radius: 6px;
        padding: 13px 14px;
        font-size: 15px;
        font-weight: 600;
      }

      .status:empty {
        display: none;
      }

      .status.ok {
        background: var(--ok-bg);
        color: var(--ok-ink);
      }

      .status.bad {
        background: var(--bad-bg);
        color: var(--bad-ink);
      }

      .contact p.status {
        color: inherit;
      }

      .hidden-field {
        position: absolute;
        left: -9999px;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }

      @media (max-width: 820px) {
        body {
          background-attachment: scroll;
        }

        main {
          grid-template-columns: 1fr;
          align-items: start;
          padding: 42px 0;
        }

        .contact {
          margin-top: 4px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="intro" aria-label="Domain sale">
        <p class="eyebrow">New Zealand domain pair</p>
        <h1>Domain for sale</h1>
        <p class="intro-text">
          Bought for a local private chef project and never used. Available as a pair for a chef,
          catering, private dining, or hospitality business.
        </p>

        <div class="domains" aria-label="Available domains">
          <div class="domain">
            <span>Included</span>
            <strong>privatechef.co.nz</strong>
          </div>
          <div class="domain">
            <span>Included</span>
            <strong>privatechef.nz</strong>
          </div>
        </div>
      </section>

      <section class="contact" aria-label="Contact form">
        <h2>Contact</h2>
        <p>Send through your name, email, and offer or question.</p>

        <form id="enquiry" action="/api/contact" method="post">
          <div class="hidden-field" aria-hidden="true">
            <label for="website">Website</label>
            <input id="website" name="website" tabindex="-1" autocomplete="off">
          </div>

          <label for="name">Name</label>
          <input id="name" name="name" autocomplete="name" maxlength="120" required>

          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="180" required>

          <label for="message">Message</label>
          <textarea id="message" name="message" maxlength="4000" required>I am interested in privatechef.co.nz and privatechef.nz.</textarea>

          <div
            class="turnstile cf-turnstile"
            data-sitekey="0x4AAAAAAEKhTsX7IP7OWQZx"
            data-theme="light"
          ></div>

          <button type="submit">Send enquiry</button>
        </form>

        <p class="status" id="status" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script>
      (function () {
        var form = document.getElementById("enquiry");
        var status = document.getElementById("status");
        var button = form.querySelector("button[type=submit]");

        function say(text, kind) {
          status.textContent = text;
          status.className = "status " + kind;
        }

        form.addEventListener("submit", async function (event) {
          event.preventDefault();
          say("", "");
          button.disabled = true;
          button.textContent = "Sending…";

          try {
            var response = await fetch("/api/contact", {
              method: "POST",
              body: new FormData(form),
              headers: { Accept: "application/json" }
            });
            var result = await response.json().catch(function () {
              return {};
            });

            if (response.ok) {
              form.hidden = true;
              say("Enquiry sent. I'll reply to the email address you gave.", "ok");
              return;
            }

            say(result.error || "That didn't send. Try again in a moment.", "bad");
          } catch (error) {
            say("No connection to the server. Check your network and try again.", "bad");
          }

          if (window.turnstile) {
            window.turnstile.reset();
          }
          button.disabled = false;
          button.textContent = "Send enquiry";
        });
      })();
    </script>
  </body>
</html>
